<!doctype html>
<html lang="zh-CN" class="loading-wallpaper newtab-booting" data-newtab-glass-startup="pending">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curator 新标签页</title>
    <style id="instant-wallpaper-startup-style">
      :root {
        color-scheme: dark;
        --bg: #101013;
        --newtab-font-sans: "Geist", "Geist Sans", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
        --wallpaper-placeholder-bg: #101013;
        --instant-wallpaper-preview-blur: 0px;
        --instant-wallpaper-preview-loading-blur: 0px;
        --instant-wallpaper-preview-loading-opacity: 1;
        --instant-wallpaper-preview-opacity: 1;
        background-color: #101013;
        font-family: var(--newtab-font-sans);
        font-optical-sizing: auto;
        font-synthesis: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      html,
      body {
        width: 100%;
        min-width: 0;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background-color: var(--wallpaper-placeholder-bg, #101013);
      }

      #newtab-wallpaper-stage {
        position: fixed;
        inset: 0;
        z-index: 0;
        contain: strict;
        background-color: var(--wallpaper-placeholder-bg, #101013);
        background-image:
          var(--newtab-runtime-wallpaper-image, var(--instant-wallpaper-image, none)),
          var(--instant-wallpaper-preview-image, none);
        background-position: var(--instant-wallpaper-position, center);
        background-repeat: no-repeat;
        background-size: var(--instant-wallpaper-size, cover);
        backface-visibility: hidden;
        pointer-events: none;
        transform: translateZ(0);
      }

      /* Content is never hidden while glass refraction is prepared. The cached
         bookmark snapshot and the live shell paint with the compatible material
         from the first frame; refraction settles inside the startup window. */
    </style>
    <style id="newtab-startup-background-mask-style">
      #newtab-background-mask {
        position: fixed;
        inset: 0;
        z-index: 0;
        contain: strict;
        background-color: var(--instant-wallpaper-mask-color, transparent);
        background-image: var(--instant-wallpaper-mask-image, none);
        -webkit-backdrop-filter: var(--instant-wallpaper-mask-filter, none);
        backdrop-filter: var(--instant-wallpaper-mask-filter, none);
        opacity: 1;
        pointer-events: none;
        transform: translateZ(0);
      }

      html[data-instant-wallpaper-mask="false"] #newtab-background-mask {
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        opacity: 0;
      }

      /* Wallpaper blur is an explicit readability setting, independent of
         the operating system's preference for opaque interface surfaces. */
    </style>
    <style id="newtab-texture-startup-style">
      #newtab-texture-stage {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 0;
        contain: strict;
        pointer-events: none;
        background: radial-gradient(ellipse at 15% 0%, #ffffff08, transparent 65%), #101013;
        --texture-field-mask: radial-gradient(ellipse at 50% 40%, #0003 5%, #0006 38%, #000 90%);
      }
      html[data-texture-background] #newtab-texture-stage {
        display: block;
      }
      #newtab-texture-stage::before,
      .newtab-texture-live {
        position: absolute;
        inset: 0;
        opacity: var(--newtab-texture-opacity, 0.13);
        mask-image: var(--texture-field-mask);
        pointer-events: none;
      }
      #newtab-texture-stage::before {
        content: "";
        background: var(--newtab-texture-image) center / cover no-repeat;
      }
      #newtab-texture-stage[data-live-texture]::before {
        opacity: 0;
      }
      @media (forced-colors: active) {
        #newtab-texture-stage::before,
        .newtab-texture-live {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="newtab-wallpaper-stage" class="newtab-background-image" data-state="visible" aria-hidden="true"></div>
    <div id="newtab-texture-stage" aria-hidden="true"></div>
    <div id="newtab-background-mask" class="newtab-background-mask" aria-hidden="true"></div>
    <div id="newtab-react-root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
